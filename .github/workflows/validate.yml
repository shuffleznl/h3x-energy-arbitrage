name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bridge_dashboard_runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: shuffleznl/h3x-bridge
      - uses: actions/checkout@v4
        with:
          path: h3x-energy-arbitrage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant contract test runtime
        run: python -m pip install homeassistant==2026.10.4 pytest pytest-asyncio PyYAML
      - name: Check real bridge entity IDs and dashboard attributes
        run: python -m pytest tools/test_bridge_registry.py -q
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python files
        run: python -m compileall custom_components tools
      - name: Validate HACS structure
        run: python tools/validate_hacs_structure.py
      - name: Validate sensor metadata
        run: python tools/validate_sensor_metadata.py
      - name: Validate periodic full-charge wiring
        run: python tools/validate_periodic_full_charge.py
      - name: Validate runtime control entities
        run: python tools/validate_control_entities.py
      - name: Validate solar self-consumption wiring
        run: python tools/validate_solar_self_consumption.py
      - name: Validate energy dashboard
        run: python tools/validate_energy_dashboard.py
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/h3x_energy_arbitrage/manifest.json > /dev/null
          python -m json.tool custom_components/h3x_energy_arbitrage/strings.json > /dev/null
          python -m json.tool custom_components/h3x_energy_arbitrage/translations/en.json > /dev/null
